[pytest]
testpaths = tests/pytest
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    prolog: marks tests that require SWI-Prolog / pyswip
    slow: marks slow integration tests

# ── Coverage (pytest-cov) ──────────────────────────────────────────────────
# Run with:  pytest --cov=src --cov-report=term-missing --cov-report=html
# HTML report is written to:  htmlcov/index.html
[coverage:run]
source = src
omit =
    src/__pycache__/*
    src/prolog/*

[coverage:report]
show_missing = true
skip_covered = false
